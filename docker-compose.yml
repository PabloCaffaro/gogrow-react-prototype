name: gogrow-react-prototype

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 3.3.12
        NODE_VERSION: 22
    command: >
      bash -c "bundle exec rails db:prepare &&
      rm -f tmp/pids/server.pid &&
      bin/dev"
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
      - "3036:3036"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db/gogrow_react_prototype_development
      RAILS_ENV: development
      SECRET_KEY_BASE: desarrollo_local_no_importa_el_valor
      VITE_USE_POLLING: "true"

volumes:
  postgres_data:
  node_modules:
  bundle_cache:
