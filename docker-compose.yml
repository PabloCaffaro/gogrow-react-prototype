name: gogrow-react-prototype

services:
  web:
    build:
      context: .
      target: development
      args:
        RUBY_VERSION: 3.3.12
        NODE_VERSION: 22
    command: bash -c "rm -f tmp/pids/server.pid && bin/dev"
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
      - "3036:3036"
    environment:
      RAILS_ENV: development
      SECRET_KEY_BASE: desarrollo_local_no_importa_el_valor
      VITE_USE_POLLING: "true"

volumes:
  node_modules:
  bundle_cache:
